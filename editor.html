<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map editor</title><link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script></head>
<body><header><a href="index.html">← All maps</a> <h1 id="title"></h1>
<div class="bar"><label><input type="checkbox" id="qr"> Show QR corner slots</label>
<label>Fit: <select id="fit"><option value="cover">Fill (crop)</option><option value="contain">Fit (no crop)</option></select></label>
<button id="png">Download PNG</button><button id="zip">Download ad files (zip)</button><button id="reset" class="danger">Reset all</button></div>
<p class="hint">Click a slot → choose image. Or drag an image file onto a slot. Work is saved in this browser automatically.</p></header>
<div id="wrap"><img id="map"><div id="slots"></div></div>
<input type="file" id="file" accept="image/*" hidden>
<script src="editor.js"></script></body></html>
